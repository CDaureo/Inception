name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "--protocol=TCP", "-h", "127.0.0.1", "ping", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - database:/var/lib/mysql
    networks:
      - inception
  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - website:/var/www/html:ro
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "$$s = @fsockopen('127.0.0.1', 9000); if (!$$s) exit(1); fclose($$s);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_VERSION: ${WP_VERSION}
      WP_TITLE: ${WP_TITLE}
      WP_OWNER_USER: ${WP_OWNER_USER}
      WP_OWNER_EMAIL: ${WP_OWNER_EMAIL}
      WP_READER_USER: ${WP_READER_USER}
      WP_READER_EMAIL: ${WP_READER_EMAIL}
    secrets:
      - db_password
      - wp_owner_password
      - wp_reader_password
    volumes:
      - website:/var/www/html
    networks:
      - inception

volumes:
  database:
  website:

networks:
  inception:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_owner_password:
    file: ../secrets/wp_owner_password.txt
  wp_reader_password:
    file: ../secrets/wp_reader_password.txt
